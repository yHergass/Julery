<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> חנות תכשיטים חדשה</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  direction: rtl;
  background: #f5f5f5;
}

header {
  background: #111;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
}

.cart-btn {
  cursor: pointer;
  background: white;
  color: black;
  padding: 5px 10px;
  border-radius: 20px;
}

.categories {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 15px;
  background: white;
}

.categories button {
  padding: 8px 15px;
  border: none;
  cursor: pointer;
}

.categories .active {
  background: black;
  color: white;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.card-content {
  padding: 10px;
}

.price {
  color: green;
  font-weight: bold;
}

/* MODAL */
.modal {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box {
  background:white;
  padding:20px;
  border-radius:10px;
  width:90%;
  max-width:400px;
}

.modal-box img {
  width:100%;
}

.add-btn {
  margin-top:10px;
  width:100%;
  padding:10px;
  background:black;
  color:white;
  border:none;
  cursor:pointer;
}

/* CART */
.cart {
  position: fixed;
  right:0;
  top:0;
  width:300px;
  height:100%;
  background:white;
  padding:15px;
  display:none;
  overflow:auto;
}
</style>

</head>

<body>

<header>
  <div> חנות תכשיטים מקסימה</div>
  <div class="cart-btn" onclick="toggleCart()">🛒 (<span id="cart-count">0</span>)</div>
</header>

<div class="categories">
  <button onclick="loadCategory('necklace', this)">שרשראות</button>
  <button onclick="loadCategory('bracelet', this)">צמידים</button>
  <button onclick="loadCategory('watch', this)">שעונים</button>
  <button onclick="loadCategory('earrings', this)">עגילים</button>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-box" id="modal-box"></div>
</div>

<!-- CART -->
<div class="cart" id="cart"></div>

<script>

/* נתוני מוצרים */
const products = {
  necklace: [
    {name:"שרשרת זהב", price:250, img:"images/necklace1.jpg"},
    {name:"שרשרת כסף", price:180, img:"images/necklace2.jpg"}
  ],
  bracelet: [
    {name:"צמיד עור", price:120, img:"images/bracelet1.jpg"}
  ],
  watch: [
    {name:"שעון יוקרתי", price:400, img:"images/watch1.jpg"}
  ],
  earrings: [
    {name:"עגילי יהלום", price:300, img:"images/earrings1.jpg"}
  ]
};

/* סל קניות */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

/* טעינת קטגוריה */
function loadCategory(category, btn) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  document.querySelectorAll(".categories button")
    .forEach(b => b.classList.remove("active"));

  if (btn) btn.classList.add("active");

  products[category].forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${item.img}">
      <div class="card-content">
        <div>${item.name}</div>
        <div class="price">₪${item.price}</div>
      </div>
    `;

    card.onclick = () => openProduct(item);
    grid.appendChild(card);
  });
}

/* פתיחת מוצר */
function openProduct(item) {
  const modal = document.getElementById("modal");
  const box = document.getElementById("modal-box");

  box.innerHTML = `
    <img src="${item.img}">
    <h2>${item.name}</h2>
    <p>תכשיט איכותי בעיצוב מודרני</p>
    <div class="price">₪${item.price}</div>
    <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">הוסף לסל</button>
  `;

  modal.style.display = "flex";
}

/* סגירת מודאל */
function closeModal(e) {
  if (e.target.id === "modal") {
    document.getElementById("modal").style.display = "none";
  }
}

/* הוספה לסל */
function addToCart(name, price) {
  cart.push({name, price});
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCart();
  alert("נוסף לסל");
}

/* עדכון סל */
function updateCart() {
  document.getElementById("cart-count").innerText = cart.length;

  const cartDiv = document.getElementById("cart");
  cartDiv.innerHTML = "<h3>סל קניות</h3>";

  cart.forEach(item => {
    cartDiv.innerHTML += `
      <div>${item.name} - ₪${item.price}</div>
    `;
  });
}

/* פתיחה/סגירה סל */
function toggleCart() {
  const c = document.getElementById("cart");
  c.style.display = c.style.display === "block" ? "none" : "block";
}

/* אתחול */
updateCart();
loadCategory("necklace");

</script>

</body>
</html>
